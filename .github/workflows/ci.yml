# Tests and type checks on every push and pull request; images built on pull requests (proof the
# Dockerfile still builds) and pushed to GHCR from main only. After a push from main, the deploy
# job writes the new image tag into the private GitOps repo, and Argo CD rolls it out from there:
# CI never talks to the cluster.
name: CI

# push only for main (to publish images); branches are covered by pull_request, so a PR branch
# runs once per push instead of twice (push + pull_request).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types
      - run: pnpm test

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
    strategy:
      matrix:
        include:
          - target: server
            image: hearth
          - target: web
            image: hearth-web
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: sha-<short> is what the cluster pins; main is for humans, never deployed. The
      # labels (org.opencontainers.image.source) link the package to this repository on GHCR.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          target: ${{ matrix.target }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # Deploy = commit the new tag to the GitOps repo's values file. Only from main, only once both
  # images are on GHCR. The key and the repo's name are secrets of the `gitops` environment, which
  # only main may use, so a workflow edited on a PR branch can't reach them (repository secrets
  # would be readable there). The repo's name is a secret because this repo's logs are public.
  deploy:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gitops
    concurrency:
      group: gitops-deploy # one at a time, in merge order; a newer merge's tag lands last
      cancel-in-progress: false
    env:
      VALUES: values/hearth.yaml
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.GITOPS_REPO }}
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
      - name: Set image.tag and push
        run: |
          tag="sha-${GITHUB_SHA::7}"
          sed -i -E "s/^(  tag: )sha-[0-9a-f]+/\1${tag}/" "$VALUES"
          grep -q "^  tag: ${tag}" "$VALUES" || { echo "no image.tag line in $VALUES"; exit 1; }
          if git diff --quiet; then echo "already at ${tag}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "hearth: deploy ${tag}" -m "From ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          # Someone may have pushed to the GitOps repo since the checkout: rebase onto it and retry.
          for _ in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
