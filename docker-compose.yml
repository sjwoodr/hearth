# Run the dev setup in Docker with live reload: `docker compose up --build`.
# The repo is bind-mounted, so edits on the host restart the processes and hot-reload Vite.
#
# Two services, as in a deployment: the model gateway (owns Ollama's slots) and hearth, which sends
# every model call through it. Needs HEARTH_GATEWAY_TOKEN in .env (both read it).
#
# Host networking keeps every address the same as running on the host: Ollama and
# SearXNG stay on 127.0.0.1, the gateway on 127.0.0.1:11435, the backend on 127.0.0.1:8787,
# Vite on :5180 (LAN too). Linux only. Stop any host `pnpm dev:fullstack` first, or the ports clash.
# (`pnpm dev:fullstack` on the host stays single-process: hearth schedules its own calls.)
x-dev: &dev
  build: .
  image: hearth-dev
  network_mode: host
  init: true # forwards Ctrl-C / docker stop so the processes exit
  volumes:
    - .:/app
    - node_modules:/app/node_modules # the containers' own; the host's stays untouched
    # Read-only so nothing in here can plant a git hook that later runs on the host.
    - ./.git:/app/.git:ro

services:
  gateway:
    <<: *dev
    # Installs dependencies first (hearth waits until this is healthy, so the two never install
    # into the shared node_modules at once), then runs with --watch like the backend.
    command: ["sh", "-c", "CI=true pnpm install --frozen-lockfile && exec node --watch server/gateway-main.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:11435/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      start_period: 120s
      retries: 40

  hearth:
    <<: *dev
    environment:
      # Gateway mode here only, not in .env, so the host's single-process setup keeps working.
      HEARTH_GATEWAY_URL: http://127.0.0.1:11435
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  node_modules:
