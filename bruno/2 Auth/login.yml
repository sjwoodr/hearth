info:
  name: login
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/login"
  body:
    type: json
    data: |-
      {"username": "{{username}}", "password": "{{password}}"}

runtime:
  scripts:
    - type: before-request
      code: |-
        // Unset {{process.env.X}} stays literal: stop here, before a doomed login counts against
        // the login throttle.
        for (const name of ["username", "password"]) {
          const value = String(bru.getEnvVar(name) ?? "");
          if (!value || value.startsWith("{{")) {
            throw new Error(`${name} is not set: add HEARTH_${name.toUpperCase()} to bruno/.env (copy .env.example), then reopen the collection.`);
          }
        }
    - type: tests
      code: |-
        test("200 and the user", () => {
          expect(res.status).to.equal(200);
          expect(res.body.username).to.equal(bru.getEnvVar("username"));
        });
        test("sets an httpOnly session cookie", () => {
          const cookie = [].concat(res.headers["set-cookie"] || []).join("; ");
          expect(cookie).to.match(/HttpOnly/i);
          expect(cookie).to.match(/SameSite=Lax/i);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
