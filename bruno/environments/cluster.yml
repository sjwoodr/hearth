name: cluster
variables:
  # Your hearth's address (its HEARTH_ORIGIN), from bruno/.env: copy .env.example to .env and set
  # HEARTH_URL. .env is gitignored, so the real address stays out of the repo.
  - name: baseUrl
    value: "{{process.env.HEARTH_URL}}"
  - name: origin
    value: "{{process.env.HEARTH_URL}}"
  # The ingress doesn't route /healthz, /readyz or /metrics; reach the api pod with
  # kubectl -n hearth port-forward deploy/hearth-api 8787
  - name: healthUrl
    value: http://localhost:8787
  # The test user, from bruno/.env (gitignored): HEARTH_USERNAME and HEARTH_PASSWORD.
  - name: username
    value: "{{process.env.HEARTH_USERNAME}}"
  - name: password
    value: "{{process.env.HEARTH_PASSWORD}}"
