info:
  name: get (with the reply)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/conversations/{{conversationId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("the message and the reply are saved", () => {
          expect(res.status).to.equal(200);
          expect(res.body.messages.map((m) => m.role)).to.deep.equal(["user", "assistant"]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
