http:
  method: GET
  url: "{{healthUrl}}/readyz"

runtime:
  scripts:
    - type: tests
      code: |-
        test("ready, database ok", () => {
          expect(res.status).to.equal(200);
          expect(res.body.ready).to.equal(true);
          expect(res.body.checks.database).to.equal("ok");
        });
        test("models reachable", () => {
          // Reported, never failing readiness: hearth still shows chats with Ollama down.
          expect(res.body.checks.models).to.equal("ok");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
