info:
  name: metrics
  type: http
  seq: 3

http:
  method: GET
  url: "{{healthUrl}}/metrics"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Prometheus text with hearth's counters", () => {
          expect(res.status).to.equal(200);
          expect(res.headers["content-type"]).to.contain("text/plain");
          expect(res.body).to.contain("# TYPE hearth_replies_total counter");
        });
        test("counters start at 0 rather than missing", () => {
          expect(res.body).to.match(/hearth_searches_total\{[^}]*outcome="asked"[^}]*\} \d+/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
