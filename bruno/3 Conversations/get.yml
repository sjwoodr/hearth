info:
  name: get
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/conversations/{{conversationId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 with the new title and no messages", () => {
          expect(res.status).to.equal(200);
          expect(res.body.conversation.title).to.equal("Bruno test chat");
          expect(res.body.messages).to.be.an("array").that.is.empty;
          expect(res.body.pendingSearch).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
