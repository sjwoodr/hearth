info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/conversations"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("conversationId", res.body.id);
    - type: tests
      code: |-
        test("201 and an id", () => {
          expect(res.status).to.equal(201);
          expect(res.body.id).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
