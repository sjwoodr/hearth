info:
  name: list
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/conversations"

runtime:
  scripts:
    - type: tests
      code: |-
        test("includes the new conversation", () => {
          expect(res.status).to.equal(200);
          expect(res.body.map((c) => c.id)).to.include(bru.getVar("conversationId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
