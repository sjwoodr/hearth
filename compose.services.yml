# hearth as several services, from the production images (Dockerfile.prod): the shape the k3s
# deployment will have, on one machine. Separate from the dev stack (docker-compose.yml): its own
# project, network and fresh database, and other ports.
#
#   docker compose -f compose.services.yml up --build -d
#   printf 'pw\npw\n' | docker compose -f compose.services.yml run --rm -T --no-deps api bin/hearth users add <you>
#   open http://localhost:8090            (or set HEARTH_SERVICES_ORIGIN for another address)
#   docker compose -f compose.services.yml down        (add -v to delete its database too)
#
# Needs HEARTH_GATEWAY_TOKEN in .env (compose reads it for ${...} below; nothing else from .env).
# Both stacks share one Ollama: its slots are shared too, so run one stack at a time for real use.
name: hearth-services

x-server: &server
  build: { context: ., dockerfile: Dockerfile.prod, target: server }
  image: hearth:local
  volumes:
    - data:/data
  extra_hosts:
    - host.docker.internal:host-gateway # the gateway, on the host network
  restart: unless-stopped

x-gateway-env: &gateway-env
  HEARTH_GATEWAY_URL: http://host.docker.internal:11436
  HEARTH_GATEWAY_TOKEN: ${HEARTH_GATEWAY_TOKEN:?set HEARTH_GATEWAY_TOKEN in .env}
  HEARTH_LOG_FORMAT: json

services:
  # Host networking, like hostNetwork in k3s: it reaches Ollama on 127.0.0.1. It listens on all
  # interfaces so the other containers can reach it; the token is what protects it.
  gateway:
    image: hearth:local
    build: { context: ., dockerfile: Dockerfile.prod, target: server }
    network_mode: host
    command: ["node", "server/gateway-main.ts"]
    environment:
      HEARTH_GATEWAY_HOST: 0.0.0.0
      HEARTH_GATEWAY_PORT: "11436"
      HEARTH_GATEWAY_TOKEN: ${HEARTH_GATEWAY_TOKEN:?set HEARTH_GATEWAY_TOKEN in .env}
      HEARTH_OLLAMA_SLOTS: ${HEARTH_OLLAMA_SLOTS:-2}
      HEARTH_LOG_FORMAT: json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:11436/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  # Runs once, before anything that uses the database.
  migrate:
    <<: *server
    command: ["node", "server/migrate.ts"]
    restart: "no"

  api:
    <<: *server
    deploy:
      replicas: 2
    environment:
      <<: *gateway-env
      HEARTH_ROLE: api
      HEARTH_AUTO_MIGRATE: "0"
      HEARTH_ORIGIN: ${HEARTH_SERVICES_ORIGIN:-http://localhost:8090}
      # The proxy reaches the api from Docker's private range; trust it to name the client.
      HEARTH_TRUSTED_PROXIES: 127.0.0.0/8, ::1/128, 172.16.0.0/12
      HEARTH_SEARXNG_URL: http://searxng:8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 20
    depends_on:
      migrate: { condition: service_completed_successfully }
      gateway: { condition: service_healthy }
      searxng: { condition: service_started }

  worker:
    <<: *server
    command: ["node", "server/worker.ts"]
    environment:
      <<: *gateway-env
      HEARTH_AUTO_MIGRATE: "0"
    depends_on:
      migrate: { condition: service_completed_successfully }
      gateway: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: Dockerfile.prod, target: web }
    image: hearth-web:local
    restart: unless-stopped

  # Stands in for the ingress: / to web, /api to the api replicas.
  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    volumes:
      - ./deploy/nginx-ingress.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:8080"
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    restart: unless-stopped

  # Its own SearXNG with your settings file (read-only); reachable only inside this stack.
  searxng:
    image: searxng/searxng@sha256:d4c2726944b38e71434ee31cb95047f5acf8acae9a06f7ad586b28cc9d4ebfd1
    volumes:
      - ${HOME}/.config/searxng:/etc/searxng:ro
    restart: unless-stopped

volumes:
  data:
