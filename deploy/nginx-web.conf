# The web image: the built front end. API calls go elsewhere (in Kubernetes the ingress routes
# /api to the api service; in compose.services.yml a separate proxy does), so this only serves files.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Built assets have hashed names: cache them hard. index.html must always be fresh.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        # Paths the app routes itself (/c/12, /memories) get index.html.
        try_files $uri $uri/ /index.html;
    }
    # nginx's mime.types has no .webmanifest; without this the app manifest goes out as
    # application/octet-stream and browsers may ignore it (icons, name, theme colour).
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
