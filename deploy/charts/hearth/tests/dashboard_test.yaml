suite: Grafana dashboard
values: [../ci/test-values.yaml]
templates: [dashboard.yaml]
tests:
  - it: renders nothing by default
    set: {metrics.dashboard.enabled: false}
    asserts:
      - hasDocuments: {count: 0}
  - it: is a ConfigMap labelled for Grafana's dashboard sidecar
    asserts:
      - isKind: {of: ConfigMap}
      - equal: {path: metadata.labels.grafana_dashboard, value: "1"}
  - it: carries the dashboard file
    asserts:
      - matchRegex: {path: 'data["hearth.json"]', pattern: '"uid": "hearth"'}
      - matchRegex: {path: 'data["hearth.json"]', pattern: 'hearth_reply_first_token_seconds_bucket'}
  - it: has an alerts timeline for hearth's namespace, with a row for each of the chart's rules
    asserts:
      - matchRegex: {path: 'data["hearth.json"]', pattern: '"type": "state-timeline"'}
      - matchRegex: {path: 'data["hearth.json"]', pattern: 'ALERTS\{namespace=\\"\$namespace\\",alertstate=\\"firing\\"\}'}
      - matchRegex: {path: 'data["hearth.json"]', pattern: 'vector\(0\), \\"alertname\\", \\"HearthOllamaDown\\"'}
      - matchRegex: {path: 'data["hearth.json"]', pattern: 'vector\(0\), \\"alertname\\", \\"HearthRepliesFailing\\"'}
      - matchRegex: {path: 'data["hearth.json"]', pattern: 'vector\(0\), \\"alertname\\", \\"HearthBackupStale\\"'}
  - it: marks each api start (a deploy or a restart) from hearth's own metrics
    asserts:
      - matchRegex: {path: 'data["hearth.json"]', pattern: '"name": "hearth started"'}
      - matchRegex: {path: 'data["hearth.json"]', pattern: 'process_start_time_seconds\{namespace=\\"\$namespace\\",service=\\"hearth\\"\}'}
  - it: takes the sidecar's label from values (Helm merges maps, so the default goes with null)
    set:
      metrics.dashboard.labels: {my_dashboards: "yes", grafana_dashboard: null}
    asserts:
      - equal: {path: metadata.labels.my_dashboards, value: "yes"}
      - notExists: {path: metadata.labels.grafana_dashboard}
