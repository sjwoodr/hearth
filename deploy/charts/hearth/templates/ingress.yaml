{{- if .Values.ingress.enabled }}
# / to the web front end, /api to the api (streamed replies pass through unbuffered on Traefik).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hearth.fullname" . }}
  labels:
    {{- include "hearth.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when the ingress is enabled" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: {{ include "hearth.fullname" . }}-api, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "hearth.fullname" . }}-web, port: {name: http}}
{{- end }}
