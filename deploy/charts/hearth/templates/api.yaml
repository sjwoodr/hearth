# The api (HEARTH_ROLE=api): HTTP routes and replies; titles and image descriptions run here too.
# Several replicas can share the SQLite file because they all run on one node (placement).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hearth.fullname" . }}-api
  labels:
    {{- include "hearth.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "hearth.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hearth.selector" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "hearth.placement" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "hearth.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef: {name: {{ include "hearth.fullname" . }}-env}
          env:
            - {name: HEARTH_ROLE, value: api}
            {{- include "hearth.gatewayClientEnv" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 8787}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          securityContext:
            {{- include "hearth.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            {{- if .Values.systemPrompt }}
            - {name: prompt, mountPath: /config, readOnly: true}
            {{- end }}
      volumes:
        {{- include "hearth.dataVolume" . | nindent 8 }}
        {{- if .Values.systemPrompt }}
        - name: prompt
          configMap: {name: {{ include "hearth.fullname" . }}-prompt}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hearth.fullname" . }}-api
  labels:
    {{- include "hearth.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "hearth.selector" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - {name: http, port: 8787, targetPort: http}
