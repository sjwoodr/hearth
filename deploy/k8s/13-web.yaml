# The front end: the built React app on unprivileged nginx.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hearth-web
  namespace: hearth
  labels: {app.kubernetes.io/name: hearth, app.kubernetes.io/component: web}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: hearth, app.kubernetes.io/component: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hearth, app.kubernetes.io/component: web}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
        - name: web
          image: ghcr.io/sjwoodr/hearth-web:sha-42addf1
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: hearth-web
  namespace: hearth
spec:
  selector: {app.kubernetes.io/name: hearth, app.kubernetes.io/component: web}
  ports:
    - {name: http, port: 8080, targetPort: http}
