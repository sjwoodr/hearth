# Stands in for the Kubernetes ingress in compose.services.yml: / to the web image, /api to the
# api replicas. Docker's DNS (127.0.0.11) returns every api replica's address for "api". A plain
# "server api:8787;" is looked up once at startup and here kept only one of them (every request
# went to the same replica), so nginx re-resolves the name itself ("resolve", nginx 1.27.3+) and
# spreads requests across all replicas, following them as they come and go.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:8787 resolve;
}
upstream web {
    zone web 64k;
    server web:8080 resolve;
}

server {
    listen 8080;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        # Replies stream line by line: pass every chunk straight through.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        # hearth trusts this header from the Docker network (HEARTH_TRUSTED_PROXIES), so the login
        # throttle sees the browser's address, not the proxy's.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m; # pasted images
    }

    location / {
        proxy_pass http://web;
    }
}
